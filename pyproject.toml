[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dienstreis-advies"
version = "0.3.0"
description = "Outbreak travel-risk advice for UGent dienstreizen: zone-level risk per outbreak profile (first: Ebola BVD DRC 2026), maps, epicurve, Dutch reply"
requires-python = ">=3.10"
dependencies = ["pandas>=2", "geopandas>=0.14", "shapely>=2", "matplotlib>=3.7", "pyyaml", "requests",
                "olefile", "adjustText>=1.0", "tabulate", "python-docx", "pypdf"]

[project.optional-dependencies]
api = ["anthropic"]
windows = ["pywin32; sys_platform == 'win32'"]
test = ["pytest"]

[project.scripts]
dienstreis = "dienstreis.cli:main"

[tool.setuptools]
packages = ["dienstreis"]

[tool.setuptools.package-data]
dienstreis = ["config/*", "prompts/*.md", "outbreaks/*/*"]
